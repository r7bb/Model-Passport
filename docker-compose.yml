# Local Model Passport stack: MinIO (object store), MLflow (tracking, artifacts in MinIO),
# the passport registry API, and the dashboard.
#
#   cp .env.example .env        # then change the credentials
#   docker compose up -d --build
#
#   MinIO console  http://localhost:9001
#   MLflow         http://localhost:5000   (set tracking.mlflow_uri in passport.yaml)
#   Registry API   http://localhost:8000/docs
#   Dashboard      http://localhost:8501

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
                  mc mb --ignore-existing local/$$MLFLOW_BUCKET"
    restart: "no"

  mlflow:
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  registry:
    build: .
    environment:
      PASSPORT_REGISTRY_TOKEN: ${PASSPORT_REGISTRY_TOKEN:-}
      PASSPORT_TRUSTED_KEYS: /keys
    ports: ["8000:8000"]
    volumes:
      - registry-data:/data
      - ./trusted-keys:/keys:ro

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0",
              "--server.port", "8501", "--server.headless", "true",
              "--browser.gatherUsageStats", "false"]
    environment:
      PASSPORT_REGISTRY_URL: http://registry:8000
    depends_on: [registry]
    ports: ["8501:8501"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
  mlflow-data:
  registry-data:
