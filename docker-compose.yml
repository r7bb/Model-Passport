# Local Model Passport stack: SeaweedFS (S3-compatible object store), MLflow (tracking,
# artifacts in the object store), the passport registry API, and the dashboard.
#
#   cp .env.example .env        # then change the credentials
#   docker compose up -d --build
#
#   Object store   http://localhost:8333 (S3 API)
#   MLflow         http://localhost:5000   (set tracking.mlflow_uri in passport.yaml)
#   Registry API   http://localhost:8000/docs
#   Dashboard      http://localhost:8501

services:
  objectstore:
    # SeaweedFS: an Apache-2.0, S3-compatible object store in one container. (MinIO no longer
    # publishes freely pullable images.) Credentials come from .env.
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports: ["8333:8333"]
    volumes: [objectstore-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30

  objectstore-init:
    # Creates the MLflow artifact bucket once the store is up.
    image: chrislusf/seaweedfs:4.47
    depends_on:
      objectstore: { condition: service_healthy }
    environment:
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name $$MLFLOW_BUCKET" | weed shell -master=objectstore:9333
    restart: "no"

  mlflow:
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    depends_on:
      objectstore-init: { condition: service_completed_successfully }
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  registry:
    build: .
    environment:
      PASSPORT_REGISTRY_TOKEN: ${PASSPORT_REGISTRY_TOKEN:-}
      PASSPORT_TRUSTED_KEYS: /keys
    ports: ["8000:8000"]
    volumes:
      - registry-data:/data
      - ./trusted-keys:/keys:ro

  dashboard:
    build: .
    command: ["passport", "dashboard", "--registry", "http://registry:8000",
              "--host", "0.0.0.0", "--port", "8501", "--no-browser"]
    depends_on: [registry]
    ports: ["8501:8501"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  objectstore-data:
  mlflow-data:
  registry-data:
