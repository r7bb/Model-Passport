[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "model-passport"
version = "0.1.0"
description = "Signed, verifiable provenance and privacy passports for trained ML models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Biju" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "cryptography>=42",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "picklescan>=0.0.20",
    "pip-audit>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
registry = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["streamlit>=1.35", "httpx>=0.27"]
mlflow = ["mlflow>=2.10"]
presidio = ["presidio-analyzer>=2.2"]
demo = ["faker>=24"]
docs = ["playwright>=1.44"]  # scripts/screenshot.py; then: python -m playwright install chromium
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "faker>=24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "types-PyYAML",
]

[project.scripts]
passport = "model_passport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/model_passport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: uses real network services (pip-audit, OSV) instead of stubs"]
filterwarnings = [
    # Third-party deprecations inside starlette's TestClient, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# TODO(quality pass): break up long Streamlit layout lines, then remove this.
"dashboard/app.py" = ["E501"]
