[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "model-passport"
dynamic = ["version"]
description = "Signed, verifiable provenance and privacy passports for trained ML models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Biju" }]
requires-python = ">=3.11"
keywords = [
    "mlops", "provenance", "model card", "privacy", "pii", "membership inference",
    "data drift", "ed25519", "supply chain", "responsible ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "cryptography>=42",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "picklescan>=0.0.20",
    "pip-audit>=2.7",
]

[project.optional-dependencies]
registry = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["streamlit>=1.35", "httpx>=0.27"]
mlflow = ["mlflow>=2.10"]
presidio = ["presidio-analyzer>=2.2"]
demo = ["faker>=24"]
# Entity-level audits of language models (Hugging Face, OpenAI-compatible, Anthropic, OpenAI).
llm = ["torch>=2.4", "transformers>=4.45", "tokenizers>=0.20", "safetensors>=0.4",
       "faker>=24", "httpx>=0.27"]
# The multi-tenant platform backend (FastAPI, PostgreSQL, S3-compatible storage, workers).
platform = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
            "psycopg[binary]>=3.2", "pyjwt>=2.9", "argon2-cffi>=23.1", "boto3>=1.35",
            "python-multipart>=0.0.9", "httpx>=0.27"]
docs = ["playwright>=1.44"]  # scripts/screenshot.py; then: python -m playwright install chromium
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "faker>=24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "types-PyYAML",
    "pandas-stubs",
    "scipy-stubs",
    "pgserver>=0.1.4",  # a throwaway PostgreSQL for the row-level security tests
]

[project.urls]
Homepage = "https://github.com/r7bb/Model-Passport"
Documentation = "https://github.com/r7bb/Model-Passport/blob/main/SETUP.md"
Changelog = "https://github.com/r7bb/Model-Passport/blob/main/CHANGELOG.md"
Issues = "https://github.com/r7bb/Model-Passport/issues"

[project.scripts]
passport = "model_passport.cli:app"

[tool.hatch.version]
path = "src/model_passport/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/model_passport", "tests", "README.md", "SETUP.md", "CHANGELOG.md", "LICENSE",
           "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_passport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: uses real network services (pip-audit, OSV) instead of stubs"]
filterwarnings = [
    # Third-party deprecations inside starlette's TestClient, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "C90", "N", "RET", "ARG", "PTH", "PIE",
    "PT", "RUF", "PERF", "PL", "S", "BLE", "TRY", "ERA", "T20", "ISC", "Q",
]
ignore = [
    "PLR2004",  # magic values in comparisons: thresholds are named where they matter
    "TRY003",   # long exception messages are the user-facing error text
    "S101",     # assert is used in tests
    "S603",     # subprocess without shell: commands are built from lists, never strings
    "RUF001",   # ambiguous unicode in strings: intentional "·", "→", "±" in output
    "RUF002",
    "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0913", "ARG", "PLC0415", "N806"]  # N806: sklearn-style X
"demo/**" = ["T20", "S301", "N803", "N806"]  # scripts print; own pickle; sklearn-style X
"scripts/**" = ["T20"]
"src/model_passport/platform/migrations/**" = ["E501", "S608"]  # generated DDL; fixed SQL
"src/model_passport/ml/**" = ["N803", "N806"]  # scikit-learn naming: X is the feature matrix
# Typer commands declare one parameter per CLI option; the count is the interface, not a smell.
"src/model_passport/cli/**" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/model_passport"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["picklescan.*", "joblib.*", "sklearn.*", "presidio_analyzer.*", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Deep-learning libraries are partly typed; treat them as Any rather than half-checked.
module = ["torch.*", "transformers.*", "tokenizers.*", "safetensors.*", "faker.*", "boto3.*",
          "botocore.*", "pgserver.*"]
ignore_missing_imports = true
follow_imports = "skip"
