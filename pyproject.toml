[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-passport"
version = "0.1.0"
description = "Signed, verifiable provenance and privacy passports for trained ML models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
passport = "model_passport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/model_passport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
