[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "model-passport"
version = "0.1.0"
description = "Signed, verifiable provenance and privacy passports for trained ML models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Biju" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "cryptography>=42",
    "pyyaml>=6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "picklescan>=0.0.20",
    "pip-audit>=2.7",
]

[project.optional-dependencies]
registry = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["streamlit>=1.35", "httpx>=0.27"]
mlflow = ["mlflow>=2.10"]
presidio = ["presidio-analyzer>=2.2"]
demo = ["faker>=24"]
docs = ["playwright>=1.44"]  # scripts/screenshot.py; then: python -m playwright install chromium
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "faker>=24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "types-PyYAML",
    "pandas-stubs",
    "scipy-stubs",
]

[project.scripts]
passport = "model_passport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/model_passport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: uses real network services (pip-audit, OSV) instead of stubs"]
filterwarnings = [
    # Third-party deprecations inside starlette's TestClient, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "C90", "N", "RET", "ARG", "PTH", "PIE",
    "PT", "RUF", "PERF", "PL", "S", "BLE", "TRY", "ERA", "T20", "ISC", "Q",
]
ignore = [
    "PLR2004",  # magic values in comparisons: thresholds are named where they matter
    "TRY003",   # long exception messages are the user-facing error text
    "S101",     # assert is used in tests
    "S603",     # subprocess without shell: commands are built from lists, never strings
    "RUF001",   # ambiguous unicode in strings: intentional "·", "→", "±" in output
    "RUF002",
    "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0913", "ARG", "PLC0415", "N806"]  # N806: sklearn-style X
"demo/**" = ["T20", "S301", "N803", "N806"]  # scripts print; own pickle; sklearn-style X
"scripts/**" = ["T20"]
# Typer commands declare one parameter per CLI option; the count is the interface, not a smell.
"src/model_passport/cli/**" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/model_passport"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["picklescan.*", "joblib.*", "sklearn.*", "presidio_analyzer.*", "mlflow.*"]
ignore_missing_imports = true
