name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,registry,dashboard,platform]"  # mypy checks these too
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  go:
    # The control plane, gateway, and mp CLI (controlplane/).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-go@v6  # the control plane integration tests build the Go binary
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      # CPU-only PyTorch: the default Linux wheel bundles GPU libraries CI does not need.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,demo,registry,dashboard,llm,platform]"
      - run: pytest --cov=model_passport --cov-report=term-missing:skip-covered
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  demo:
    # The policy gate: `passport build` exits 1 on a fail verdict, so a push that lets PII,
    # a leaky model, a secret, or a critical CVE into the demo fails this job.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[demo]"
      - name: Scan the repository for committed secrets
        run: passport scan secrets src demo passport.yaml policy.yaml action.yml
      - name: Certify, monitor, retrain, re-certify
        run: bash demo/update_cycle.sh
      - name: Verify the final passport
        run: passport verify passport.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: passport
          path: |
            passport.json
            passport.html
            .passport/history/
          if-no-files-found: ignore

  package:
    # Build the sdist and wheel, then install the wheel into a clean environment the way a user
    # would (no editable install, no repository on the path) and use it on a fresh dataset.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel contains the dashboard, report stylesheet, and type marker
        run: |
          unzip -l dist/*.whl | grep -E "dashboard/app.py|report/style.css|py.typed"
      - name: Install the wheel and use it on a new dataset
        run: |
          python -m venv /tmp/user && . /tmp/user/bin/activate
          pip install "$(ls dist/*.whl)[demo]"
          mkdir /tmp/project && cd /tmp/project && git init -q
          python "$GITHUB_WORKSPACE/demo/make_dataset.py" --rows 800 --out customers.csv
          passport --version
          passport init --data customers.csv --label income
          passport run --set train.search=quick
          passport build
          passport verify
          passport prepare customers.csv
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  action:
    # The reusable GitHub Action (action.yml) on the demo project.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install numpy pandas faker && python demo/make_dataset.py
      - id: passport
        uses: ./
        with:
          extras: demo
          upload-artifact: "false"
      - run: test "${{ steps.passport.outputs.verdict }}" = "pass"

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Create an env file for CI only
        run: |
          cp .env.example .env
          sed -i "s/^S3_SECRET_KEY=.*/S3_SECRET_KEY=$(openssl rand -hex 24)/" .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start the stack
        run: |
          set -o pipefail
          if ! docker compose up -d 2>&1 | tee /tmp/up.log; then
            # Workflow-command properties must not contain ":" or ","; messages keep one line.
            echo "::error title=compose up failed::$(tail -n 8 /tmp/up.log | tr '\n' '|' | cut -c1-900)"
            exit 1
          fi
      - name: Wait for every service to be healthy
        run: |
          check() {  # name url
            for _ in $(seq 1 60); do
              if curl -fsS "$2" >/dev/null 2>&1; then echo "$1 healthy"; return 0; fi
              sleep 5
            done
            echo "::error title=$1 unhealthy::$1 did not answer $2 within 5 minutes"
            return 1
          }
          check registry http://localhost:8000/health
          check mlflow http://localhost:5000/health
          check dashboard http://localhost:8501/_stcore/health
          test "$(docker compose ps -a --format '{{.ExitCode}}' objectstore-init)" = "0"
      - name: Report container state and logs as annotations
        if: failure()
        run: |
          echo "::error title=container state::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | tr '\n' '|')"
          for service in $(docker compose config --services); do
            tail=$(docker compose logs --no-color --tail 15 "$service" 2>&1 | tr '\n' '|' | cut -c1-900)
            echo "::error title=logs of $service::$tail"
          done
      - if: always()
        run: docker compose down -v
